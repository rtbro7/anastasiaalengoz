<style>

  --ink:#04040a; --cream:#EFE7D8; --warm:#F6E3B8;

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--ink)}
body{color:var(--cream);font-family:var(--serif);font-weight:300;

/* ---------- layers ---------- */
.lyr{position:fixed;inset:0;pointer-events:none}
#frames{z-index:0;overflow:hidden;background:var(--ink)}
#frames img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;

  transition:opacity 1.5s var(--e),transform 2.6s var(--e),filter 1.5s var(--e)}
#frames img.cur{opacity:1;transform:scale(1.0);filter:blur(0)}
#frames img.prev{opacity:0;transform:scale(1.3);filter:blur(14px)}
#stars{z-index:1}
#over{z-index:3;overflow:visible}
#grain{z-index:4;background:url(f/noise.png);opacity:.055;mix-blend-mode:screen;
  animation:gr .6s steps(1) infinite}
@keyframes gr{0%{background-position:0 0}25%{background-position:-40px 30px}
50%{background-position:60px -20px}75%{background-position:-25px -55px}100%{background-position:35px 45px}}
#vig{z-index:5;background:
  linear-gradient(180deg,rgba(4,4,10,.62) 0%,rgba(4,4,10,0) 20%,rgba(4,4,10,.05) 33%,rgba(4,4,10,.72) 60%,rgba(4,4,10,.96) 82%,#04040a 100%),

/* ---------- overlay vectors ---------- */
#over svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .9s var(--e)}

.dr{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);transition:stroke-dashoffset 1.9s var(--e) var(--d,0s)}
svg.on .dr{stroke-dashoffset:0}
.pt{fill:rgba(239,231,216,.9)}
.pt.big{fill:#fff}
.lb{font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001ms!important;animation:none!important}
}
</style>

/* ===================== разметка текста ===================== */
function words(str,base,stepMs){
  var out='',d=base;
  str.split(/(\s+)/).forEach(function(tk){
    if(/^\s+$/.test(tk)){ out+=tk; return; }
    out+='<span class="w"><i style="--d:'+d.toFixed(2)+'s">'+tk+'</i></span>';
    d+=stepMs;
  });
  return out;
}
function chars(str,base,stepMs){
  var out='',d=base;
  for(var i=0;i<str.length;i++){
    var ch=str[i];
    if(ch===' '){ out+='<i style="--d:'+d.toFixed(2)+'s">&nbsp;</i>'; }
    else out+='<i style="--d:'+d.toFixed(2)+'s">'+ch+'</i>';
    d+=stepMs;
  }
  return out;
}
function build(html){
  var base=.55;
  // {{...}} — посимвольно, {...} — по словам
  html=html.replace(/\{\{([^}]*)\}\}/g,function(m,s){ var r=chars(s,base,.035); base+=s.length*.035+.35; return r; });
  html=html.replace(/\{([^}]*)\}/g,function(m,s){ var r=words(s,base,.055); base+=s.split(/\s+/).length*.055+.3; return r; });
  return html;
}

function proj(w,h){
  // простая гномоническая проекция вокруг центра поля, RA растёт влево
  var cra=279.0, cde=-28.0, scale=Math.min(w,h)/26; // px на градус
  return function(ra,de){
    var x=w/2 - (ra-cra)*Math.cos(de*Math.PI/180)*scale;
    var y=h/2 - (de-cde)*scale;
    return [x,y];
  };
}
function svgEl(inner){

function len(x1,y1,x2,y2){ return Math.hypot(x2-x1,y2-y1); }

function makeOverlay(kind,w,h){

      d+=0.09;
    });
    TEAPOT.forEach(function(t){
      var a=pos[t.k];
      s+='<circle class="pt" cx="'+a[0].toFixed(1)+'" cy="'+a[1].toFixed(1)+'" r="2"/>';
      if(t.n) s+='<text class="lb" x="'+(a[0]+9).toFixed(1)+'" y="'+(a[1]+3).toFixed(1)+'" style="--d:1.5s">'+t.n+'</text>';
    });
    var her=p(RA,DEC);
    s+='<circle class="pt big" cx="'+her[0].toFixed(1)+'" cy="'+her[1].toFixed(1)+'" r="2.6"/>';
    s+='<circle class="st warm dr" cx="'+her[0].toFixed(1)+'" cy="'+her[1].toFixed(1)+'" r="13" style="--L:82;--d:1.7s"/>';
    s+='<text class="lb" x="'+(her[0]+20).toFixed(1)+'" y="'+(her[1]+3).toFixed(1)+'" style="--d:2.1s">Здесь</text>';
    if(kind==='arrow'){
      var g2=pos.g2, ant=[g2[0]+Math.min(w,h)/26*21.5, g2[1]-6]; // Антарес — на запад, вправо в этой проекции
      ant[0]=Math.min(ant[0], w-58);
      var L=len(g2[0],g2[1],ant[0],ant[1]);
      s+='<line class="st warm dr" x1="'+g2[0].toFixed(1)+'" y1="'+g2[1].toFixed(1)+'" x2="'+ant[0].toFixed(1)+'" y2="'+ant[1].toFixed(1)+'" style="--L:'+L.toFixed(0)+';--d:.5s"/>';
      s+='<circle class="pt big" cx="'+ant[0].toFixed(1)+'" cy="'+ant[1].toFixed(1)+'" r="3.4"/>';
      s+='<text class="lb" x="'+(ant[0]-4).toFixed(1)+'" y="'+(ant[1]-14).toFixed(1)+'" text-anchor="end" style="--d:2.2s">Антарес</text>';
    }
  }
  else if(kind==='galaxy'){
    var cx=w/2, cy=h*0.40, rx=Math.min(w*0.40,190), ry=rx*0.20;
    s+='<ellipse class="st faint dr" cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" style="--L:'+(2*Math.PI*Math.sqrt((rx*rx+ry*ry)/2)).toFixed(0)+';--d:.35s"/>';
    s+='<ellipse class="st dr" cx="'+cx+'" cy="'+cy+'" rx="'+(rx*0.22)+'" ry="'+(ry*1.5)+'" style="--L:'+(2*Math.PI*rx*0.25).toFixed(0)+';--d:.9s"/>';
    s+='<circle class="pt big" cx="'+cx+'" cy="'+cy+'" r="3"/>';
    s+='<text class="lb" x="'+cx+'" y="'+(cy-ry*1.5-12)+'" text-anchor="middle" style="--d:1.9s">Sgr A*</text>';
    var ex=cx+rx*0.62, ey=cy+ry*0.55;
    s+='<circle class="pt" cx="'+ex+'" cy="'+ey+'" r="2.4"/>';
    s+='<text class="lb" x="'+(ex+10)+'" y="'+(ey+12)+'" style="--d:2.1s">Земля</text>';
    var L2=len(ex,ey,cx,cy);
    s+='<line class="st warm dr" x1="'+ex+'" y1="'+ey+'" x2="'+cx+'" y2="'+cy+'" style="--L:'+L2.toFixed(0)+';--d:1.3s"/>';
    s+='<text class="lb" x="'+((ex+cx)/2)+'" y="'+((ey+cy)/2+30)+'" text-anchor="middle" style="--d:2.4s">27 000 световых лет</text>';
  }
  else if(kind==='neb'||kind==='neb2'){
    var items = kind==='neb'
      ? [[0.30,0.62,'M8 · Лагуна'],[0.60,0.34,'M20 · Трифид']]
      : [[0.52,0.42,'M20 · Трифид'],[0.30,0.24,'M21']];
    items.forEach(function(it,i){
      var x=w*it[0], y=h*it[1], r=Math.min(w,h)*0.075;
      s+='<circle class="st dr" cx="'+x.toFixed(0)+'" cy="'+y.toFixed(0)+'" r="'+r.toFixed(0)+'" style="--L:'+(2*Math.PI*r).toFixed(0)+';--d:'+(0.4+i*0.35)+'s"/>';
      var lx=x+r+34;
      s+='<line class="st faint dr" x1="'+(x+r).toFixed(0)+'" y1="'+y.toFixed(0)+'" x2="'+lx.toFixed(0)+'" y2="'+y.toFixed(0)+'" style="--L:34;--d:'+(1.1+i*0.35)+'s"/>';
      s+='<text class="lb" x="'+(lx+7).toFixed(0)+'" y="'+(y+3).toFixed(0)+'" style="--d:'+(1.5+i*0.35)+'s">'+it[2]+'</text>';
    });
  }
  else if(kind==='reticle'){
    var x=w/2, y=h*0.42, r=30;
    s+='<circle class="st warm dr" cx="'+x+'" cy="'+y+'" r="'+r+'" style="--L:'+(2*Math.PI*r).toFixed(0)+';--d:.5s"/>';
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(function(v,i){
      s+='<line class="st dr" x1="'+(x+v[0]*(r+9))+'" y1="'+(y+v[1]*(r+9))+'" x2="'+(x+v[0]*(r+22))+'" y2="'+(y+v[1]*(r+22))+'" style="--L:14;--d:'+(1.3+i*0.08)+'s"/>';
    });
    s+='<circle class="pt big" cx="'+x+'" cy="'+y+'" r="2.4"/>';
  }
  return svgEl(s);
}
var ovCache={};
function showOverlay(kind){
  Array.prototype.forEach.call(overEl.children,function(c){ c.classList.remove('on'); });
  if(!kind) return;
  var w=innerWidth,h=innerHeight,key=kind+'_'+w+'x'+h;
  if(!ovCache[key]){
    var el=makeOverlay(kind,w,h);
    el.setAttribute('viewBox','0 0 '+w+' '+h);
    overEl.appendChild(el); ovCache[key]=el;
  }
  var e=ovCache[key];
  e.classList.remove('on'); void e.getBoundingClientRect();
  requestAnimationFrame(function(){ e.classList.add('on'); });
}

/* ===================== звёзды ===================== */
var cv=document.getElementById('stars'), cx2=cv.getContext('2d');
var SW,SH,DPR,pool=[],cfg={n:150,speed:.06,tw:1,bloom:false},born=0,t0=performance.now();
function seed(){
  DPR=Math.min(devicePixelRatio||1,2); SW=innerWidth; SH=innerHeight;
  cv.width=SW*DPR; cv.height=SH*DPR; cx2.setTransform(DPR,0,0,DPR,0,0);
  pool=[];
  for(var i=0;i<420;i++){
    pool.push({x:Math.random()*SW,y:Math.random()*SH,r:Math.random()<.78?Math.random()*.8+.25:Math.random()*1.5+.7,
      a:Math.random()*.5+.25,s:Math.random()*.9+.3,p:Math.random()*Math.PI*2,
      vx:(Math.random()-.5),vy:(Math.random()-.5),
      h:Math.random()<.86?0:(Math.random()<.5?1:2)});
  }
}
var TINT=['255,253,247','176,203,240','247,229,190'];
function loop(now){
  var t=(now-t0)/1000;
  cx2.clearRect(0,0,SW,SH);
  var target=cfg.n, lim=cfg.ignite? Math.min(target, Math.floor(born*target)) : target;
  for(var i=0;i<lim;i++){
    var st=pool[i%pool.length];
    var x=st.x+st.vx*t*cfg.speed*14, y=st.y+st.vy*t*cfg.speed*14;
    x=((x%SW)+SW)%SW; y=((y%SH)+SH)%SH;
    var tw=.62+.38*Math.sin(t*st.s*cfg.tw+st.p);
    cx2.globalAlpha=st.a*tw*(cfg.bloom?1.25:1);
    cx2.fillStyle='rgb('+TINT[st.h]+')';
    cx2.beginPath(); cx2.arc(x,y,st.r,0,6.2832); cx2.fill();
    if(st.r>1.45){
      var g=cx2.createRadialGradient(x,y,0,x,y,st.r*8);
      g.addColorStop(0,'rgba('+TINT[st.h]+','+(0.14*tw)+')'); g.addColorStop(1,'rgba('+TINT[st.h]+',0)');
      cx2.globalAlpha=1; cx2.fillStyle=g;
      cx2.beginPath(); cx2.arc(x,y,st.r*8,0,6.2832); cx2.fill();
    }
  }
  if(cfg.ignite && born<1) born=Math.min(1,born+0.006);
  requestAnimationFrame(loop);
}
seed(); requestAnimationFrame(loop);

/* ===================== параллакс ===================== */
var px=0,py=0,tx=0,ty=0;
function par(){
  px+=(tx-px)*.06; py+=(ty-py)*.06;
  framesEl.style.transform='translate3d('+(px*1.5).toFixed(2)+'px,'+(py*1.5).toFixed(2)+'px,0)';
  overEl.style.transform='translate3d('+(px*2.6).toFixed(2)+'px,'+(py*2.6).toFixed(2)+'px,0)';
  cv.style.transform='translate3d('+(px*3.6).toFixed(2)+'px,'+(py*3.6).toFixed(2)+'px,0)';
  requestAnimationFrame(par);
}
par();
addEventListener('pointermove',function(e){ tx=(e.clientX/innerWidth-.5)*-16; ty=(e.clientY/innerHeight-.5)*-12; },{passive:true});
addEventListener('deviceorientation',function(e){
  if(e.gamma==null) return;
  tx=Math.max(-16,Math.min(16,-e.gamma*0.5)); ty=Math.max(-12,Math.min(12,-(e.beta-45)*0.28));
},{passive:true});

/* ===================== счётчик координат ===================== */
function rollTo(el,finalStr,dur){
  if(!el) return;
  var chsPool='0123456789', start=performance.now();
  var target=finalStr;
  function tick(now){
    var k=Math.min(1,(now-start)/dur);
    var keep=Math.floor(k*target.length);
    var out='';
    for(var i=0;i<target.length;i++){
      var c=target[i];
      if(i<keep || !/[0-9]/.test(c)) out+=c;
      else out+=chsPool[Math.floor(Math.random()*10)];
    }
    el.textContent=out;
    if(k<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ===================== движок шагов ===================== */
var slides=STEPS.map(function(s){
  var d=document.createElement('div'); d.className='sl';
  d.innerHTML=(s.eb?'<div class="eb">'+s.eb+'</div>':'')+build(s.html);
  deck.appendChild(d); return d;
});
var i=0,lock=false;
function render(){
  var s=STEPS[i];
  slides.forEach(function(el,k){ el.classList.toggle('on',k===i); });
  showFrame(s.f);
  showOverlay(s.ov);
  cfg=Object.assign({n:200,speed:.06,tw:1,bloom:false,ignite:false},s.stars||{});
  if(cfg.ignite && born===0) born=0.02; else if(!cfg.ignite) born=1;
  railb.style.width=((i+1)/STEPS.length*100)+'%';
  go.classList.toggle('off', i===STEPS.length-1);
  prefetch(i+1);
  if(s.html.indexOf('rollA')>-1){
    setTimeout(function(){
      rollTo(document.getElementById('rollA'),'18h 03m 13.816s',1500);
      rollTo(document.getElementById('rollB'),'−22° 49′ 51.22″',1800);
    },1400);
  }
  var b=document.getElementById('openSky');
  if(b) b.onclick=function(ev){ ev.stopPropagation(); openSky(); };
}
function step(d){
  if(lock) return;
  var t=i+d; if(t<0||t>STEPS.length-1) return;
  lock=true; i=t; render();
  setTimeout(function(){lock=false;},620);
}
document.body.addEventListener('click',function(e){
  if(e.target.closest('a')||e.target.closest('button')||document.getElementById('sky').classList.contains('on')) return;
  step(1);
});
go.addEventListener('click',function(e){ e.stopPropagation(); step(1); });
addEventListener('keydown',function(e){
  if(['ArrowRight','ArrowDown',' ','Enter'].indexOf(e.key)>-1){ e.preventDefault(); step(1); }
  if(['ArrowLeft','ArrowUp'].indexOf(e.key)>-1){ e.preventDefault(); step(-1); }
});
var sx=0,sy=0;
addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
addEventListener('touchend',function(e){
  if(document.getElementById('sky').classList.contains('on')) return;
  var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>44&&Math.abs(dx)>Math.abs(dy)) step(dx<0?1:-1);
  else if(Math.abs(dy)>54&&Math.abs(dy)>Math.abs(dx)) step(dy<0?1:-1);
},{passive:true});

addEventListener('resize',function(){ seed(); ovCache={}; overEl.innerHTML=''; showOverlay(STEPS[i].ov); });

/* ===================== часы Пхукета ===================== */
function tickClock(){
  var d=new Date(Date.now()+ (7*60 - (-new Date().getTimezoneOffset()))*0 );
  var f=new Intl.DateTimeFormat('ru-RU',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  clock.textContent='Пхукет '+f.format(new Date());
  setTimeout(tickClock,1000);
}
tickClock();

/* ===================== живое небо ===================== */
var skyEl=document.getElementById('sky'), aladinReady=false;
function openSky(){
  skyEl.classList.add('on');
  if(aladinReady) return;
  aladinReady=true;
  var s=document.createElement('script');
  s.src='https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js';
  s.onload=function(){
    A.init.then(function(){
      var al=A.aladin('#ald',{survey:'P/DSS2/color',fov:0.9,target:RA+' '+DEC,
        showReticle:false,showZoomControl:false,showFullscreenControl:false,
        showLayersControl:true,showGotoControl:false,showShareControl:false,
        showCooGrid:false,showFrame:false,cooFrame:'ICRS'});
      var cat=A.catalog({name:'Anastasia Alengoz',sourceSize:16,color:'#F6E3B8',shape:'circle'});
      al.addCatalog(cat);
      cat.addSources([A.source(RA,DEC,{name:'Anastasia Alengoz'})]);
    });
  };
  document.head.appendChild(s);
}
document.getElementById('skyx').onclick=function(e){ e.stopPropagation(); skyEl.classList.remove('on'); };

render();
})();
</script>
