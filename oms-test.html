<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>OMS frame test</title>
<style>html,body{margin:0;background:#05050a;color:#EDE6DA;font:13px/1.5 ui-monospace,monospace}
#log{padding:10px;border-bottom:1px solid #333}
iframe{width:100%;height:80vh;border:0;background:#000}</style></head><body>
<div id="log">проверяю…</div>
<iframe id="f" src="https://osr.org/oms/ru/NJV317522"></iframe>
<script>
var f=document.getElementById('f'),log=document.getElementById('log'),done=false;
f.addEventListener('load',function(){done=true;
  var ok='?';
  try{ ok = f.contentWindow.length!==undefined ? 'загрузился (доступ к содержимому ограничен CORS — это норма)' : '?'; }catch(e){ ok='загрузился (cross-origin)'; }
  log.textContent='IFRAME: '+ok;});
setTimeout(function(){ if(!done) log.textContent='IFRAME: НЕ загрузился за 12с — вероятно X-Frame-Options / CSP блокируют встраивание'; },12000);
</script></body></html>
